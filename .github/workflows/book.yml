name: Book Mudd 2146

on:
  schedule:
    - cron: "15 6 * * *"   # ~12:15am Central (CST). GitHub may run it a bit late — fine.
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      date:
        description: "YYYY-MM-DD (blank = 7 days out)"
        required: false
      blocks:
        description: 'Override blocks, e.g. 23:00-24:00=jacobhe@u.northwestern.edu (blank = default 12-4am + 4pm-midnight)'
        required: false

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: |
          args=(--netid "$NETID" --now)
          [ -n "$DATE" ] && args+=(--date "$DATE")
          [ -n "$BLOCKS" ] && args+=(--blocks "$BLOCKS")
          python book_room.py --room mudd "${args[@]}"
        env:
          NETID: ${{ secrets.NETID }}
          DATE: ${{ inputs.date }}
          BLOCKS: ${{ inputs.blocks }}
